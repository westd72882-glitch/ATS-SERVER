name: Build signed & obfuscated APK

# Жми "Run workflow" (вкладка Actions) — соберётся APK даже без единого секрета:
# если ASSET_KEY / keystore-секреты не заданы, пайплайн сгенерирует их сам на лету
# (ключ шифрования эфемерный, подпись — самоподписанный keystore, только для теста/личной установки).
# Для официального релиза в Releases добавь секреты ASSET_KEY, KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD — тогда будет использован твой постоянный ключ/подпись.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install npm deps
        run: npm install

      - name: Resolve ASSET_KEY (use secret, or generate ephemeral)
        env:
          SECRET_ASSET_KEY: ${{ secrets.ASSET_KEY }}
        run: |
          if [ -z "$SECRET_ASSET_KEY" ]; then
            echo "::warning::ASSET_KEY secret не задан — сгенерирован одноразовый ключ (ок для теста, для релиза добавь свой секрет)."
            echo "ASSET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          else
            echo "ASSET_KEY=$SECRET_ASSET_KEY" >> "$GITHUB_ENV"
          fi

      - name: Build obfuscated & encrypted web bundle
        env:
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure signing + R8/ProGuard + native key plugin
        run: node scripts/configure-android.js

      - name: Resolve signing keystore (use secret, or generate self-signed)
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SECRET_KEYSTORE_BASE64" ]; then
            echo "::warning::Секреты keystore не заданы — сгенерирован одноразовый self-signed keystore (для теста/личной установки; для публикации в сторах сделай постоянный ключ и добавь секреты)."
            STORE_PASS=$(openssl rand -hex 16)
            KEY_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/release.keystore -alias ephemeral \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=ATS Game, OU=CI, O=ATS, L=NA, S=NA, C=US"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=ephemeral" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/release.keystore

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ats-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
